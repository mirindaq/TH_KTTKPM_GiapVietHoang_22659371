server:
  port: 8081
  servlet:
    context-path: /product-service

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:mariadb://localhost:3307/product_db
    username: root
    password: 123456
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

resilience4j:
  retry:
    instances:
      retryTest:
        # Thử tối đa 3 lần
        maxAttempts: 3
        # Chờ 500ms giữa mỗi lần retry
        waitDuration: 500
  ratelimiter:
    instances:
      rateLimitTest:
        # Cho phép 10 request mỗi 1 giây
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        # Nếu hết quota, chờ tối đa 0s rồi trả 429
        timeoutDuration: 0s
  timelimiter:
    instances:
      timeLimitTest:
        # Timeout sau 2 giây
        timeoutDuration: 2s
        cancelRunningFuture: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
